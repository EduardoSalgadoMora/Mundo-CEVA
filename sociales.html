<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El clima · Mundo de bloques · Sociales</title>
<link rel="icon" type="image/png" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<link href="fonts/fonts.css" rel="stylesheet">
<script src="minijuegos.js"></script>
<script src="premios.js"></script>

<style>
:root{
  --sky:#9ED4FF; --sky2:#DDF1FF; --ink:#1E1E1E; --soft:#3B4A3B;
  --card:#F4EBD9; --cardInk:#1E1E1E; --btn:#E6D8BC; --line:#1B1B1B;
  --accent:#3E8E2B; --grass:#5DBB3F; --dirt:#8B5A2B; --gold:#F2C94C; --ok:#2E8B3E; --bad:#C62F37;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font-family:"Nunito",system-ui,sans-serif;
  background:linear-gradient(to bottom,var(--sky),var(--sky2) 70%);display:flex;flex-direction:column;image-rendering:pixelated}
.ground{margin-top:auto;height:56px;flex:none;border-top:3px solid var(--line);
  background:linear-gradient(to bottom,#5DBB3F 0 12px,#3E8E2B 12px 15px,#8B5A2B 15px);position:relative}
.ground::after{content:"";position:absolute;inset:15px 0 0;
  background-image:linear-gradient(90deg,rgba(0,0,0,.18) 50%,transparent 50%),linear-gradient(rgba(0,0,0,.12) 50%,transparent 50%);
  background-size:20px 20px,20px 20px}
main{width:100%;max-width:760px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px}
.px{font-family:"Press Start 2P",monospace}
h1{font-family:"Press Start 2P",monospace;font-size:clamp(1rem,4.8vw,1.45rem);line-height:1.45;margin:0;color:#fff;text-shadow:3px 3px 0 #1B1B1B}
.top{display:flex;align-items:center;gap:12px}
.top .mascot{width:72px;flex:none}
.top .sub{margin:6px 0 0;color:var(--soft);font-weight:900}
.stats{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{background:var(--card);color:var(--cardInk);border:3px solid var(--line);padding:5px 10px;font-weight:900;white-space:nowrap;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.2),inset 3px 3px 0 rgba(255,255,255,.5)}
.homebtn{align-self:flex-start;display:inline-block;font:inherit;font-weight:900;font-size:.95rem;padding:8px 14px;border:3px solid var(--line);
  background:var(--card);color:var(--ink);text-decoration:none;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.5)}
.hero{border:3px solid var(--line);overflow:hidden;margin-bottom:14px;background:#9ED4FF}
.hero svg{display:block;width:100%;height:auto}
.album{background:var(--card);color:var(--cardInk);border:3px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.45)}
.album .row{display:flex;flex-wrap:wrap;gap:6px;font-size:1.6rem;line-height:1}
.album .row span{width:42px;height:42px;display:grid;place-items:center;background:var(--btn);border:3px solid var(--line)}
.album .row span.lock{font-size:1rem;opacity:.5}
.album p{margin:0;font-weight:800;color:var(--soft);font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;background:var(--card);color:var(--cardInk);
  border:3px solid var(--line);box-shadow:inset -4px -4px 0 rgba(0,0,0,.2),inset 4px 4px 0 rgba(255,255,255,.5);cursor:pointer;font:inherit}
.card:active{box-shadow:inset 4px 4px 0 rgba(0,0,0,.25)}
.card .ic{width:52px;height:52px;flex:none;display:grid;place-items:center;font-size:1.7rem;background:#9ED4FF;border:3px solid var(--line)}
.card .ic svg{width:40px;height:40px}
.card b{display:block;font-size:1.05rem}
.card small{display:block;opacity:.75;font-size:.88rem}
.card .st{color:#C08A00;letter-spacing:2px;font-size:1rem}
.card.locked{opacity:.55;cursor:default}
button:focus-visible,.card:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.bar{display:flex;align-items:center;gap:10px}
.btn{font:inherit;font-weight:900;font-size:1.05rem;padding:12px 14px;border:3px solid var(--line);background:var(--btn);color:var(--cardInk);cursor:pointer;
  touch-action:manipulation;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.5)}
.btn:active{box-shadow:inset 4px 4px 0 rgba(0,0,0,.3)}
.btn.small{font-size:.9rem;padding:8px 12px}
.btn.go{background:var(--accent);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{cursor:default}
.progress{flex:1;height:18px;border:3px solid var(--line);background:#5E3B1A;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#5DBB3F 0 10px,#4CA632 10px 20px);transition:width .25s}
.panel{background:var(--card);color:var(--cardInk);border:3px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;
  box-shadow:inset -5px -5px 0 rgba(0,0,0,.15),inset 5px 5px 0 rgba(255,255,255,.45)}
.qhead{display:flex;align-items:center;gap:10px}
.qlabel{font-weight:900;font-size:1.15rem;margin:0;flex:1}
.speak{width:48px;height:48px;padding:0;font-size:1.3rem;flex:none}
.display{display:flex;flex-direction:column;align-items:center;gap:10px}
.sentence{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(1.25rem,5.2vw,1.7rem);text-align:center;line-height:1.25}
.pix{display:block;border:3px solid var(--line);background:#fff}
.pix svg{display:block;width:100%;height:auto;shape-rendering:crispEdges}
.solo{width:min(150px,44vw)}
.scene{width:min(400px,88vw)}
.tower{width:min(360px,88vw)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.feedback{font-size:1.06rem;line-height:1.5;min-height:1.5em}
.feedback b.y{color:var(--ok)} .feedback b.n{color:var(--bad)}
.slots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.slot{width:30px;height:38px;border:3px solid var(--line);background:#E9F5FF;display:grid;place-items:center;font-family:"Press Start 2P",monospace;font-size:.85rem}
.slot.f{background:#5DBB3F;color:#fff;text-shadow:2px 2px 0 #1B1B1B}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.letters .btn{width:52px;height:52px;padding:0;font-family:"Press Start 2P",monospace;font-size:1rem;background:#B48A5A;color:#fff;text-shadow:2px 2px 0 #1B1B1B}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.result{text-align:center;align-items:center}
.result .stars{font-size:2.6rem;color:#C08A00;letter-spacing:6px}
.result .score{font-family:"Press Start 2P",monospace;font-size:1.6rem;line-height:1.3}
.unlock{background:var(--btn);border:3px dashed var(--accent);padding:10px 14px;font-weight:900}
.tip{margin:0;line-height:1.5;opacity:.85}
.pic{display:inline-block;width:34px;height:34px;vertical-align:middle;margin-right:6px}
.pic svg{width:100%;height:100%;shape-rendering:crispEdges}
.def{background:#fff;border:3px solid var(--line);padding:10px 12px;font-weight:800;text-align:center;line-height:1.4}
[hidden]{display:none!important}
@media (max-width:430px){ .opts{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){.shake{animation:none}.progress span{transition:none}}
</style>
</head>
<body>
<main>
<a class="homebtn" href="index.html">⟵ Inicio</a>
  <header class="top">

    <div class="hero" id="hero" aria-hidden="true"></div>

      <p id="nextUnlock"></p>

      <p id="prizeProg"></p>

    <div id="exBtns"></div>
    <div class="grid" id="cards" style="margin-top:14px"></div>
    <div id="mgCards"></div>

  <section id="play" hidden>
    <div class="bar">

      <div class="qhead">
        <p class="qlabel" id="qLabel"></p>

      <div id="opts"></div>

      <button class="btn go" id="next" hidden>Siguiente ➜</button>
    </div>

  <section id="result" hidden>
    <div class="panel result">

      <div class="score" id="rScore"></div>
      <p id="rMsg" style="margin:0;font-size:1.15rem;font-weight:900"></p>
      <div class="unlock" id="rUnlock" hidden></div>
      <p class="tip" id="rTip"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn go" id="prize" hidden>Jugar al premio</button>
        <button class="btn go" id="again">Jugar otra vez</button>
        <button class="btn" id="toMenu">Volver al mundo</button>
      </div>
    </div>
  </section>
</main>
<div class="ground" aria-hidden="true"></div>

<script>
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick=(a,n)=>shuffle(a).slice(0,n);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const speak=t=>CEVA.speak(t,"es-ES");
const canSpeak=!!((window.Android&&Android.speakLang)||("speechSynthesis" in window));

/* ---------- PIXEL ART ---------- */
const PAL={k:"#1B1B1B",w:"#FFFFFF",y:"#FFD23F",o:"#F59E0B",g:"#5DBB3F",G:"#3E8E2B",d:"#8B5A2B",D:"#5E3B1A",b:"#4FA3E0",B:"#2B6CB0",
  s:"#E3CF8F",S:"#C2A862",r:"#E0444E",R:"#9E2A2F",c:"#D5DDE5",C:"#8C99A6",n:"#F4F8FF",m:"#8A8F98",M:"#5F646C",L:"#8DA94B",p:"#9B6BD6",l:"#9ED4FF",v:"#4A3F3A",t:"#E5C04B",e:"#4C9A2A"};
function sprite(rows,bg){
  const h=rows.length,w=rows[0].length; let s=`<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">`+(bg?`<rect width="${w}" height="${h}" fill="${bg}"/>`:"");
  rows.forEach((r,y)=>{ for(let x=0;x<w;x++){ const c=r[x]; if(c!=="."&&PAL[c]) s+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[c]}"/>`; } });
  return s+"</svg>";
}
const SPR={
  thermo:["....kkk.....","...kwwwk....","...kwwwk....","...kwrwk.k..","...kwrwk....","...kwrwk.k..","...kwrwk....","...kwrwk.k..","..krrrrrk...","..krrrrrk...","..krrrrrk...","...kkkkk...."],
  rain:["............","...kkkk.....","..kccccKk...".replace("K","k"),".kccccccck..","kcccccccccck","kCCCCCCCCCCk",".kkkkkkkkkk.","..b...b...b.","..b..b...b..",".b...b..b...",".b..b...b...","............"],
  drop:[".....k......","....kbk.....","....kbk.....","...kbbbk....","...kbbbk....","..kbbwbbk...","..kbbwbbk...","..kbbbbbk...","..kbbbbbk...","...kbbbk....","....kkk.....","............"],
  wind:["............","kkkkkkkk....","........k...","....kkkk....","............","kkkkkkkkkk..","..........k.","......kkkk..","............","kkkkkk......",".......k....","....kkk....."],
  pluvio:["kkkkkkkkkkkk","kcccccccccck",".kcccccccck.","..kcccccck..","...kkcckk...","....kcck....","...kkkkkk...","...kwwwwk...","...kwwwwk...","...kbbbbk...","...kbbbbk...","...kkkkkk..."],
  anemo:["............",".kk......kk.","kcck....kcck",".kkkkkkkkkk.","....kCCk....",".....kk.....",".....CC.....",".....CC.....",".....CC.....",".....CC.....","...kkkkkk...","............"],
  veleta:[".....k......",".....krr....",".....krrr...",".....krrrr..",".....k......","kk...k....k.","kkkkkkkkkkkk","kk...k....k.",".....k......",".....k......","...kkkkk....","............"],
  baro:["...kkkkkk...","..kwwwwwwk..",".kwrwwwwbwk.","kwwwrwwwwwwk","kwwwwrwwwwwk","kwwwwwkwwwwk","kwwwwwwwwwwk","kwbwwwwwwrwk",".kwwwwwwwwk.","..kwwwwwwk..","...kkkkkk...","............"],
  higro:[".....k......","....kbk.....","...kbbbk....","...kbwbk....","....kkk.....","..kkkkkkkk..",".kwwwwwwwwk.",".kwwwkrwwwk.",".kwwwkwwwwk.",".kwrwwwwbwk.","..kkkkkkkk..","............"],
  sun:["....y..y....","..y.yyyy.y..","...yyyyyy...",".yyyoyyoyyy.","..yyyyyyyy..","yyyyyyyyyyyy","..yyoyyoyy..",".yyyyooyyyy.","...yyyyyy...","..y.yyyy.y..","....y..y....","............"],
  cloud:["............","............","....kkkk....","...kwwwwk...",".kkwwwwwwkk.","kwwwwwwwwwwk","kwwwwwwwwwwk",".kkkkkkkkkk.","............","............","............","............"],
  snow:["............",".....w......","..w..w..w...","...w.w.w....","....www.....","wwwwwwwwwww.","....www.....","...w.w.w....","..w..w..w...",".....w......","............","............"],
  globe:["....kkkk....","..kkbbbbkk..",".kbggbbbbbk.",".kbgggbbggk.","kbbggbbbgggk","kbbbbbbbggbk","kbbbbgbbbbbk","kbbbgggbbbbk",".kbbbggbbbk.",".kbbbbbbbbk.","..kkbbbbkk..","....kkkk...."],
  layers:["kkkkkkkkkkkk","kppppppppppk","kkkkkkkkkkkk","kbbbbbbbbbbk","kkkkkkkkkkkk","kllllllllllk","kkkkkkkkkkkk","kwwwwwwwwwwk","kkkkkkkkkkkk","kggggggggggk","kddddddddddk","kkkkkkkkkkkk"],
  mountain:["............",".....kk.....","....knnk....","...knnnnk...","...kmnnmk...","..kmmmmmmk..","..kmmMmmmk..",".kmmmmMmmmk.",".kmMmmmmmmk.","kmmmmmmMmmmk","kggggggggggk","kkkkkkkkkkkk"],
  map:["............","..kkkkkk....",".kggbgggkk..",".kgggggggk..","kggttttggk..","kgtttttttk..","kgttttttrk..",".kttttttrk..",".kkttttrrk..","...kkkkkk...","..........k.","........kkk."],
  pencil:["..........kk",".........kyk","........kyk.",".......kyk..","......kyk...",".....kyk....","....kyk.....","...kyk......","..kyk.......",".ksk........",".kk.........","............"],
  trophy:["............","kkkkkkkkkkkk","kyyyyyyyyyyk",".kyyyyyyyyk.","kkyyyyyyyykk","..kyyyyyyk..","...kyyyyk...","....kyyk....",".....kk.....","....kyyk....","...kkkkkk...","...kddddk..."],
  nubo:["............","....kkkk....","..kkwwwwkk..",".kwwwwwwwwk.","kwwkwwwwkwwk","kwwkwwwwkwwk","kwrwwwwwwrwk","kwwwkkkkwwwk",".kwwwwwwwwk.","..kkkkkkkk..","...b...b....","..b...b....."]
};
const spr=(n,bg)=>sprite(SPR[n],bg);

/* bloques 10x10 para paisajes */
const T=10;
function blk(x,y,t){
  const X=x*T,Y=y*T, r=(c,dx,dy,w,h)=>`<rect x="${X+dx}" y="${Y+dy}" width="${w}" height="${h}" fill="${c}"/>`;
  switch(t){
    case"grass": return r("#8B5A2B",0,0,10,10)+r("#5DBB3F",0,0,10,3)+r("#5DBB3F",2,3,2,1)+r("#5DBB3F",7,3,1,2)+r("#6E4521",5,6,2,2)+r("#A0703D",1,7,1,1);
    case"dry": return r("#8B5A2B",0,0,10,10)+r("#C9B45A",0,0,10,3)+r("#C9B45A",3,3,2,1)+r("#6E4521",6,6,2,2);
    case"dirt": return r("#8B5A2B",0,0,10,10)+r("#6E4521",2,2,2,2)+r("#6E4521",6,6,2,2)+r("#A0703D",7,1,1,1);
    case"stone": return r("#8A8F98",0,0,10,10)+r("#6F747C",1,2,3,2)+r("#6F747C",6,6,3,2)+r("#A3A8B0",6,1,2,1);
    case"snow": return r("#8A8F98",0,0,10,10)+r("#F4F8FF",0,0,10,4)+r("#F4F8FF",2,4,2,2)+r("#F4F8FF",7,4,1,1)+r("#6F747C",5,7,3,2);
    case"sand": return r("#E3CF8F",0,0,10,10)+r("#C9B271",2,2,1,1)+r("#C9B271",6,5,1,1)+r("#C9B271",3,7,1,1);
    case"water": return r("#3F8FE0",0,0,10,10)+r("#7FC0F5",1,2,3,1)+r("#7FC0F5",6,6,3,1);
    case"lava": return r("#4A3F3A",0,0,10,10)+r("#5E524C",1,1,3,2)+r("#34302D",6,5,3,3);
    case"leaf": return r("#3E8E2B",0,0,10,10)+r("#2F6E21",1,1,2,2)+r("#55A83F",6,2,2,2)+r("#2F6E21",4,6,2,2);
    case"olive": return r("#8DA94B",0,0,10,10)+r("#6E8A35",2,1,2,2)+r("#A8C266",6,5,2,2)+r("#3D4F1C",4,4,1,1);
    case"pine": return r("#1F5E2E",0,0,10,10)+r("#2C7A3D",2,2,2,2)+r("#174A24",6,6,2,2);
    case"palm": return r("#4CAF50",0,0,10,10)+r("#357A38",0,4,10,2)+r("#6CCF6F",3,1,2,2);
    case"wood": return r("#6B4423",0,0,10,10)+r("#4E3018",3,0,1,10)+r("#4E3018",7,0,1,10);
    case"palmwood": return r("#A1683A",0,0,10,10)+r("#7A4E2B",0,3,10,1)+r("#7A4E2B",0,7,10,1);
    case"cactus": return r("#4C9A2A",0,0,10,10)+r("#357A1E",2,0,1,10)+r("#357A1E",7,0,1,10)+r("#E8F5C8",4,2,1,1)+r("#E8F5C8",5,6,1,1);
    case"wheat": return r("#E5C04B",1,2,1,8)+r("#E5C04B",4,0,1,10)+r("#E5C04B",7,3,1,7)+r("#C99A1C",0,2,3,2)+r("#C99A1C",3,0,3,2)+r("#C99A1C",6,3,3,2);
    case"flower": return r("#3E8E2B",4,4,2,6)+r("#E0444E",3,1,4,3)+r("#FFD23F",4,2,2,1);
    case"cloud": return r("#FFFFFF",0,2,10,6);
    case"dark": return r("#AEB8C2",0,2,10,6)+r("#8C99A6",0,6,10,2);
    case"rain": return r("#3F8FE0",2,1,1,3)+r("#3F8FE0",7,5,1,3);
    case"flake": return r("#FFFFFF",4,1,2,8)+r("#FFFFFF",1,4,8,2);
    case"sun": return r("#FFD23F",0,0,10,10)+r("#FFF0A0",2,2,3,3);
    case"sunO": return r("#FFB84D",0,0,10,10)+r("#FFE08A",2,2,3,3);
  }
  return "";
}
function scene(sky,list,w=16,h=10){
  let s=`<svg viewBox="0 0 ${w*T} ${h*T}" aria-hidden="true"><rect width="${w*T}" height="${h*T}" fill="${sky}"/>`;
  list.forEach(([x,y,t])=>s+=blk(x,y,t)); return s+"</svg>";
}
/* utilidades para construir paisajes */
const col=(x,top,h,topT,under)=>{ const a=[[x,top,topT]]; for(let y=top+1;y<h;y++) a.push([x,y,under]); return a; };
function land(hs,topT,under,h=10){ return hs.flatMap((t,x)=>t==null?[]:col(x,t,h,typeof topT==="function"?topT(x,t):topT,typeof under==="function"?under(x):under)); }
const oak=(x,y)=>[[x,y-1,"wood"],[x,y-2,"wood"],[x-1,y-3,"leaf"],[x,y-3,"leaf"],[x+1,y-3,"leaf"],[x,y-4,"leaf"]];

const LAYERS=["troposfera","estratosfera","mesosfera","termosfera","exosfera"];
const LCOL={troposfera:"#9ED4FF",estratosfera:"#6FA8E8",mesosfera:"#4A6FC7",termosfera:"#3A3F9E",exosfera:"#1C1B4A"};
function tower(hi,showNames){
  const W=180,LH=26,H=LH*5+24; let s=`<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  LAYERS.slice().reverse().forEach((n,i)=>{ const y=i*LH;
    s+=`<rect x="0" y="${y}" width="${W}" height="${LH}" fill="${LCOL[n]}" stroke="#1B1B1B" stroke-width="2"/>`;
    if(n==="exosfera") s+=`<rect x="20" y="${y+6}" width="2" height="2" fill="#fff"/><rect x="140" y="${y+14}" width="2" height="2" fill="#fff"/><rect x="100" y="${y+5}" width="2" height="2" fill="#fff"/>`;
    if(showNames||n===hi) s+=`<text x="${W/2}" y="${y+17}" text-anchor="middle" font-family="'Press Start 2P',monospace" font-size="${n===hi&&!showNames?9:7}" fill="#fff" stroke="#1B1B1B" stroke-width=".6">${n===hi&&!showNames?"???":n.toUpperCase()}</text>`;
    if(n===hi) s+=`<rect x="1" y="${y+1}" width="${W-2}" height="${LH-2}" fill="none" stroke="#FFD23F" stroke-width="4"/>`;
  });
  s+=`<rect x="0" y="${LH*5}" width="${W}" height="8" fill="#5DBB3F" stroke="#1B1B1B" stroke-width="2"/><rect x="0" y="${LH*5+8}" width="${W}" height="16" fill="#8B5A2B" stroke="#1B1B1B" stroke-width="2"/>`;
  return s+"</svg>";
}

  $("nextUnlock").textContent=nx?`Álbum de pegatinas · Siguiente desbloqueo con ${nx.at}⭐ (te faltan ${nx.at-tot})`:"Álbum completo. ¡Eres un crack del clima!";
  const done=GAMES.filter(g=>save.perfect[g.id]).length;
  $("prizeProg").textContent=`Premio: ${done}/${GAMES.length} juegos sin fallos`+(save.vueltas?` · Vueltas completadas: ${save.vueltas}`:"")+" · Cada estrella = 1 💎";
  const box=$("cards"); box.innerHTML="";
  GAMES.forEach((g,i)=>{
    const open=isOpen(i), b=document.createElement("button");
    b.className="card"+(open?"":" locked");
    b.innerHTML=`<span class="ic">${open?spr(g.ic):"🔒"}</span><span><b>${g.name}</b><small>${open?g.topic:"Consigue 1⭐ en el anterior"}</small>
      <span class="st">${starStr(save.best[g.id]||0)}${save.perfect[g.id]?" ✔":""}</span></span>`;
    if(open) b.onclick=()=>start(g.id); else b.disabled=true;
    box.appendChild(b);
  });
}
function show(id){ ["menu","play","result"].forEach(s=>$(s).hidden=s!==id); window.scrollTo(0,0); }

let S=null;
function buildQs(kinds,n){
  const used=new Set(), qs=[]; let tries=0;
  while(qs.length<n&&tries<500){ tries++; const q=GEN[rnd(kinds)](); if(used.has(q.key)) continue; used.add(q.key); qs.push(q); }
  while(qs.length<n) qs.push(GEN[rnd(kinds)]());
  return qs;
}
function start(id){
  S={id,i:0,score:0,answered:false,before:totalStars()};
  if(id==="spell"){ S.words=pick(WORDS,6); S.total=6; }
  else if(id==="final"){ S.qs=buildQs(["atm","tiempo","elem","instr","fact","climas","donde"],10); S.total=10; }
  else { S.qs=buildQs([id],8); S.total=8; }
  show("play"); render();
}
function header(){
  $("count").textContent=`${S.i+1}/${S.total}`;
  $("prog").style.width=(S.i/S.total*100)+"%";
  $("fb").innerHTML=""; $("next").hidden=true; S.answered=false;
}
function render(){
  header();
  if(S.id==="spell") return renderSpell();
  const q=S.qs[S.i];
  $("qLabel").textContent=q.label;
  $("disp").innerHTML=q.display;
  const txt=$("disp").querySelector(".sentence,.def");
  $("speakBtn").hidden=!canSpeak||!txt; $("speakBtn").onclick=()=>{ if(txt) speak(txt.textContent.replace(/_+/g,"…")); };
  const o=$("opts"); o.innerHTML=""; o.className="opts"+(q.one?" one":"");
  q.options.forEach(op=>{ const b=document.createElement("button"); b.className="btn"; b.innerHTML=op.html; b.dataset.val=op.val; b.onclick=()=>choose(op.val,b); o.appendChild(b); });
}
function choose(val,btn){
  if(S.answered) return; S.answered=true;
  const q=S.qs[S.i], ok=val===q.answer;
  [...$("opts").children].forEach(b=>{ b.disabled=true; if(b.dataset.val===q.answer) b.classList.add("ok"); });
  if(!ok) btn.classList.add("bad","shake"); else S.score++;
  $("fb").innerHTML=(ok?'<b class="y">¡Bloque conseguido! ⛏️</b> ':'<b class="n">¡Ups!</b> ')+q.explain;
  $("next").hidden=false; $("next").focus();
}

/* construye la palabra */
function renderSpell(){
  const [w,d]=S.words[S.i]; S.pos=0; S.miss=false;
  $("qLabel").textContent="Construye la palabra bloque a bloque.";
  $("speakBtn").hidden=!canSpeak; $("speakBtn").onclick=()=>speak(d);
  $("disp").innerHTML=`${def(d)}<div class="slots" id="slots">${[...w].map(()=>`<span class="slot"></span>`).join("")}</div>`;
  const o=$("opts"); o.className="letters";
  let L=shuffle([...w]); if(L.join("")===w) L=shuffle(L);
  o.innerHTML=L.map(l=>`<button class="btn" data-l="${l}">${l}</button>`).join("");
  o.querySelectorAll("button").forEach(b=>b.onclick=()=>tapLetter(b));
}
function tapLetter(b){
  if(S.answered||b.disabled) return;
  const [w]=S.words[S.i];
  if(b.dataset.l===w[S.pos]){
    const sl=$("slots").children[S.pos]; sl.textContent=b.dataset.l; sl.classList.add("f"); b.disabled=true; b.style.visibility="hidden"; S.pos++;
    if(S.pos===w.length){ S.answered=true; if(!S.miss) S.score++;
      $("fb").innerHTML=(S.miss?'<b class="y">¡Construida!</b> ':'<b class="y">¡Perfecta! ⛏️</b> ')+`${w}.`;
      $("next").hidden=false; $("next").focus(); }
  } else {
    S.miss=true; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake","bad"); setTimeout(()=>b.classList.remove("bad"),450);
    $("fb").innerHTML='<b class="n">Ese bloque no va ahora.</b> Lee otra vez la pista.';
  }
}

function next(){ S.i++; if(S.i>=S.total) return finish(); render(); }
function finish(){
  $("prog").style.width="100%";
  const st=starsFor(S.score,S.total);
  save.best[S.id]=Math.max(save.best[S.id]||0,st);
  save.gems=(save.gems||0)+st;
  const perfect=S.score===S.total; if(perfect) save.perfect[S.id]=true;
  persist();
  $("rStars").textContent=starStr(st);
  $("rScore").textContent=`${S.score}/${S.total}`;
  const after=totalStars(), news=MILES.filter(m=>S.before<m.at&&after>=m.at);
  const done=GAMES.filter(g=>save.perfect[g.id]).length, all=done===GAMES.length;
  $("rMsg").textContent=all?"¡Todos los juegos sin fallos! Te has ganado el premio."
    :perfect?`¡Todo perfecto! Llevas ${done} de ${GAMES.length} juegos sin fallos.`
    :st===3?"¡Genial! Casi perfecto.":st===2?"¡Muy bien!":st===1?"¡Bien! Sigue practicando.":"Vuelve a intentarlo, ¡tú puedes!";
  const unl=news.map(m=>`${m.st} Nueva pegatina: ${m.name}`).join("<br>");
  $("rUnlock").hidden=!unl; $("rUnlock").innerHTML=unl;
  $("rTip").textContent=(st?`Ganas ${st} 💎. `:"Sin estrellas no hay gemas esta vez. ")+"Truco: "+TIPS[S.id];
  $("gemTotal").textContent=`💎 ${CEVA.wallet(PROFILE)}`;
  $("prize").hidden=!all;
  show("result"); $("again").focus();
}
$("next").onclick=next;
$("quit").onclick=()=>{ renderMenu(); show("menu"); };
$("again").onclick=()=>start(S.id);
$("toMenu").onclick=()=>{ renderMenu(); show("menu"); };
$("prize").onclick=()=>{ save.perfect={}; persist(); Premios.start(save.vueltas||0,()=>{ save.best={}; save.perfect={}; save.vueltas=(save.vueltas||0)+1; persist(); renderMenu(); show("menu"); }); };

/* portada y mascota */
$("mascot").innerHTML=`<span class="pix" style="border:none;background:none">${spr("nubo")}</span>`;
$("hero").innerHTML=scene("#9ED4FF",[[2,1,"sun"],...cloud(7,1),...cloud(23,2,"dark",4),...rainRow(23,3,4),[16,0,"flake"],[18,2,"flake"],

    (x)=>x>=8&&x<=11||x>=25?"water":"dirt"),...oak(2,7),...olv(5,6),...pin(13,5),[22,6,"cactus"],[22,5,"cactus"],...palm(27,8).map(([x,y,t])=>[x,y-1,t])],32,10);
